<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level Up</title>
<meta name="description" content="Una quest al giorno: streak, livelli, boss e un buddy che cresce con te.">
<meta name="theme-color" content="#13112b">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Level Up">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#13112b; --bg2:#1c1940; --card:#251f55; --card2:#2e2766; --line:#41388a;
  --text:#ffffff; --muted:#c5bff2; --dim:#8f88c9;
  --acc:#6a46f5; --acc-d:#4a2ad0; --on-acc:#ffffff;
  --gold:#ffc23d; --gold-d:#d0900a; --ok:#3ddc84; --ok-d:#1f9d58;
  --fire:#ff7a1a; --bad:#ff5a7a; --blue:#4cc3ff; --purple:#c46bff;
  --r:20px;
  color-scheme: dark;
}
body[data-theme=lava]{--bg:#1f0d0b;--bg2:#2d1411;--card:#3c1a15;--card2:#4c221b;--line:#73321f;--acc:#ff6a3d;--acc-d:#c03a12;--on-acc:#2a0800;--muted:#f6c9b9;--dim:#bd8a78}
body[data-theme=ocean]{--bg:#06182a;--bg2:#0a2440;--card:#0e3156;--card2:#133d6b;--line:#1d5a8f;--acc:#1fb6ff;--acc-d:#0a7fbd;--on-acc:#03203a;--muted:#b9def6;--dim:#7ca9c8}
body[data-theme=jungle]{--bg:#0a1d12;--bg2:#0f2e1c;--card:#153c26;--card2:#1c4c31;--line:#2b6b45;--acc:#2fcf78;--acc-d:#178e4d;--on-acc:#04230f;--muted:#c0e9d0;--dim:#84b89a}
body[data-theme=gold]{--bg:#191304;--bg2:#281f09;--card:#38290c;--card2:#483610;--line:#70571c;--acc:#ffc23d;--acc-d:#c98b08;--on-acc:#2a1d00;--muted:#f4e3b3;--dim:#c0a76b}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100dvh; color:var(--text);
  background:radial-gradient(circle at 50% -10%, var(--bg2), var(--bg) 62%) fixed, var(--bg);
  font-family:ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
}
#app{max-width:520px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 104px)}
body.wz #app{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:2rem; line-height:1.08; margin:.35em 0}
h2{font-size:1.55rem; line-height:1.12; margin:.45em 0 .35em}
h3{font-size:1.08rem; margin:1.1em 0 .5em; color:var(--muted)}
p{font-size:1.08rem; line-height:1.38; margin:.45em 0}
a{color:inherit}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.92rem} .center{text-align:center}
b,strong{font-weight:800}
button{font:inherit; color:inherit}
.card,.bubble,.say,.sentence,.pact,.toast,.mc,.diary{overflow-wrap:anywhere}

.card{background:var(--card); border:2px solid var(--line); border-radius:var(--r); padding:16px; margin:14px 0; box-shadow:0 6px 0 rgba(0,0,0,.28)}
.row{display:flex; align-items:center; gap:12px}
.grow{flex:1; min-width:0}

.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:0; border-radius:16px; padding:13px 16px; font-weight:800; font-size:1.15rem; line-height:1.15; color:var(--on-acc); background:var(--acc); box-shadow:0 5px 0 var(--acc-d); cursor:pointer; transition:transform .06s, box-shadow .06s, filter .15s; margin-top:10px; text-align:center; text-decoration:none; touch-action:manipulation}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--acc-d)}
.btn small{font-size:.8rem; font-weight:700}
.btn.ok{background:var(--ok); box-shadow:0 5px 0 var(--ok-d); color:#04260f}
.btn.ok:active{box-shadow:0 1px 0 var(--ok-d)}
.btn.gold{background:var(--gold); box-shadow:0 5px 0 var(--gold-d); color:#2a1d00}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-d)}
.btn.ghost{background:transparent; border:2px solid var(--line); box-shadow:none; color:var(--muted)}
.btn.big{font-size:1.35rem; padding:17px 16px}
.btn[disabled]{opacity:.4; pointer-events:none}
.link{background:none; border:0; color:var(--muted); text-decoration:underline; text-underline-offset:3px; font-weight:700; font-size:.95rem; padding:12px 4px; min-height:44px; cursor:pointer; display:block; margin:0 auto; touch-action:manipulation}

.chips{display:flex; flex-wrap:wrap; margin:-4px}
.chip{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:9px 13px; border-radius:14px; background:var(--card2); border:2px solid var(--line); color:var(--text); font-weight:700; font-size:1rem; margin:4px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.25); text-align:left; line-height:1.2; touch-action:manipulation}
.chip.on{background:var(--acc); border-color:var(--acc); color:var(--on-acc)}
.chip .tag{font-size:.7rem; background:var(--gold); color:#2a1d00; border-radius:99px; padding:1px 7px}
.chips.col{flex-direction:column}
.chips.col .chip{width:calc(100% - 8px)}
input.txt,textarea.txt{width:100%; font:inherit; font-size:1.1rem; padding:11px 14px; border-radius:14px; border:2px solid var(--line); background:var(--bg2); color:var(--text); outline:none; margin-top:6px}
input.txt:focus,textarea.txt:focus{border-color:var(--acc)}
textarea.txt{min-height:90px; resize:vertical}
.check{display:flex; gap:10px; align-items:flex-start; margin-top:10px; line-height:1.3}
.check input{width:22px; height:22px; flex:none; margin:0}
input[type=file]{font-size:16px; margin-top:8px; max-width:100%; color:var(--muted)}

/* wizard */
.wz-top{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.wz-back{width:44px; height:44px; border-radius:12px; border:2px solid var(--line); background:var(--card); font-size:1.2rem; cursor:pointer; flex:none}
.bar{flex:1; height:14px; background:var(--card); border-radius:99px; overflow:hidden; border:2px solid var(--line)}
.bar>i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--fire)); border-radius:99px; transition:width .45s}
.xpc{font-weight:800; color:var(--gold); white-space:nowrap}
.lesson{display:inline-block; background:rgba(255,194,61,.14); color:var(--gold); border:1.5px solid rgba(255,194,61,.45); padding:3px 11px; border-radius:99px; font-weight:800; font-size:.85rem}
.hero{text-align:center; padding:18px 0 4px}
.big-emoji{font-size:110px; line-height:1.05; display:inline-block; filter:drop-shadow(0 8px 0 rgba(0,0,0,.28))}
.say{background:var(--bg2); border-left:4px solid var(--gold); border-radius:12px; padding:10px 14px; margin:12px 0}
.wz-foot{margin-top:18px}
.buddy-pick{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.bp{border:2px solid var(--line); background:var(--card2); border-radius:18px; padding:12px 8px; cursor:pointer; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,.25); font:inherit; color:inherit}
.bp .e{display:block; font-size:54px; line-height:1.1}
.bp b{display:block}
.bp .evo{display:block; font-size:.95rem; color:var(--dim)}
.kc .ke,.badge .be{display:block}
.bp.on{border-color:var(--gold); background:var(--card); box-shadow:0 0 0 3px var(--gold) inset, 0 4px 0 rgba(0,0,0,.25)}
.calc{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0}
.calc .box{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:12px; text-align:center}
.calc .num{font-size:2.3rem; font-weight:800; line-height:1.1}
.calc .up .num{color:var(--ok)} .calc .down .num{color:var(--bad)}
.sentence{background:#fff8e7; color:#2b2140; border-radius:14px; padding:12px 14px; font-weight:700; margin-top:14px; font-size:1.08rem; line-height:1.35}
.quiz .chip{width:calc(100% - 8px)}
.fb{border-radius:14px; padding:10px 14px; margin-top:10px; font-weight:700}
.fb.ok{background:rgba(61,220,132,.15); border:2px solid var(--ok)} .fb.no{background:rgba(255,90,122,.15); border:2px solid var(--bad)}
.pact{background:#fff8e7; color:#2b2140; border-radius:18px; padding:18px 16px; border:3px solid #e2c88f; box-shadow:0 6px 0 rgba(0,0,0,.3); text-align:left}
.pact p{font-size:1.02rem; margin:.4em 0}
.pact ul{margin:.3em 0; padding-left:1.2em} .pact li{margin:.2em 0}
.pact-title{font-weight:800; font-size:1.3rem; text-align:center; letter-spacing:.06em}
.pact .sig{display:block; max-width:100%; height:80px; margin:6px auto 0}
.pact-foot{font-size:.85rem; text-align:center; opacity:.7}
.sigpad{width:100%; height:130px; background:#fff; border-radius:14px; border:2px dashed #c9b37c; touch-action:none; display:block; margin-top:8px; cursor:crosshair}
.gate ol li{margin:.45em 0; font-size:1.05rem}
.gate img{border-radius:24px; box-shadow:0 6px 0 rgba(0,0,0,.3)}

/* home */
.topbar{display:flex; align-items:center; gap:8px}
.pill{display:inline-flex; align-items:center; gap:5px; background:var(--card); border:2px solid var(--line); padding:4px 11px; border-radius:99px; font-weight:800; white-space:nowrap}
.pill.lv{background:var(--acc); border-color:var(--acc); color:var(--on-acc)}
.iconbtn{width:44px; height:44px; border-radius:12px; border:2px solid var(--line); background:var(--card); font-size:1.15rem; cursor:pointer; flex:none}
.xp{margin-top:10px}
.xp .bar>i{background:linear-gradient(90deg,var(--acc),var(--blue))}
.xp .lbl{display:flex; justify-content:space-between; font-size:.85rem; color:var(--dim); font-weight:700; margin-top:2px}
.buddy-zone{text-align:center; padding-top:30px}
.buddy{position:relative; display:inline-block; font-size:118px; line-height:1.05; isolation:isolate; cursor:pointer; background:none; border:0; padding:0}
.buddy .hat{position:absolute; left:50%; top:-34px; transform:translateX(-50%); font-size:50px}
.buddy.aura-fire::before,.buddy.aura-bolt::before,.buddy.aura-rainbow::before{content:''; position:absolute; inset:-18px; border-radius:50%; z-index:-1; animation:pulse 1.6s ease-in-out infinite}
.buddy.aura-fire::before{background:radial-gradient(circle, rgba(255,122,26,.6), transparent 66%)}
.buddy.aura-bolt::before{background:radial-gradient(circle, rgba(76,195,255,.6), transparent 66%)}
.buddy.aura-rainbow::before{background:conic-gradient(from 0deg, rgba(255,90,122,.5), rgba(255,194,61,.5), rgba(61,220,132,.5), rgba(76,195,255,.5), rgba(196,107,255,.5), rgba(255,90,122,.5)); -webkit-mask:radial-gradient(circle, #000 35%, transparent 70%); mask:radial-gradient(circle, #000 35%, transparent 70%)}
.bname{font-weight:800; color:var(--muted); font-size:.95rem}
.bubble{position:relative; background:#fff; color:#1b1640; border-radius:18px; padding:11px 14px; font-weight:700; font-size:1.04rem; line-height:1.3; margin:12px auto 0; box-shadow:0 4px 0 rgba(0,0,0,.28); text-align:left}
.bubble::before{content:''; position:absolute; top:-10px; left:50%; transform:translateX(-50%); border:10px solid transparent; border-top:0; border-bottom-color:#fff}
.quest .qe{font-size:46px; line-height:1}
.quest .qt{font-size:1.55rem; font-weight:800; line-height:1.1}
.label{font-size:.78rem; letter-spacing:.08em; font-weight:800; color:var(--dim); text-transform:uppercase}
.donebox{background:rgba(61,220,132,.14); border:2px solid var(--ok); border-radius:14px; padding:12px; font-weight:800; text-align:center; margin-top:10px; font-size:1.1rem}
.flame{font-size:62px; line-height:1}
.flame.off{filter:grayscale(1) opacity(.45)}
.flame.ember{filter:saturate(.35) brightness(.75)}
.flame.wait{filter:saturate(.8) brightness(.9)}
.snum{font-size:2.9rem; font-weight:800; line-height:.95}
.state{margin-top:8px; font-weight:700; font-size:1rem; line-height:1.3}
.state.warn{color:var(--gold)}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:12px}
.wd{text-align:center; font-size:.78rem; color:var(--dim); font-weight:800}
.wd b{display:grid; place-items:center; height:34px; border-radius:10px; background:var(--bg2); border:2px solid var(--line); font-size:1rem; margin-top:2px; color:#fff}
.wd.done b{background:var(--fire); border-color:var(--fire); color:#2a0800}
.wd.epic b{background:var(--gold); border-color:var(--gold)}
.wd.shield b{background:var(--blue); border-color:var(--blue)}
.wd.miss b{border-color:rgba(255,90,122,.6)}
.wd.today b{border-style:dashed; border-color:#fff}
.chest-card .ce{font-size:48px}
.moods{display:flex; justify-content:space-between; gap:6px; margin-top:8px}
.moods button{flex:1; font-size:34px; background:var(--card2); border:2px solid var(--line); border-radius:14px; padding:6px 0 2px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.25); touch-action:manipulation}
.moods button span{display:block; font-size:.7rem; font-weight:800; color:var(--dim)}
.boss-e{font-size:52px; line-height:1}
.boss-e.dead{filter:grayscale(1); opacity:.5; transform:rotate(90deg)}
.hp{font-size:1.1rem; letter-spacing:2px}
.tip{background:var(--bg2); border-radius:12px; padding:8px 12px; margin-top:10px}
.banner{background:linear-gradient(90deg, rgba(255,194,61,.2), rgba(255,122,26,.2)); border:2px solid var(--gold); border-radius:16px; padding:12px; margin-top:12px}
.banner .btns{display:flex; gap:8px} .banner .btn{margin-top:8px; font-size:1rem; padding:10px; min-height:44px}
.inuse{display:inline-block; font-weight:800; color:var(--ok); white-space:nowrap; padding:9px 4px}
.care{border-color:var(--blue)}

.xlist{display:flex; flex-direction:column; gap:8px; margin-top:10px}
.xrow{display:flex; align-items:center; gap:10px; width:100%; background:var(--card2); border:2px solid var(--line); border-radius:14px; padding:8px 12px; min-height:54px; cursor:pointer; font-family:inherit; color:inherit; text-align:left; box-shadow:0 3px 0 rgba(0,0,0,.25); touch-action:manipulation}
.xrow .xe{font-size:1.7rem; width:38px; text-align:center; line-height:1}
.xrow b{display:block; font-size:1.05rem; line-height:1.15}
.xrow small{display:block; font-size:.72rem; color:var(--dim); font-weight:800; text-transform:uppercase; letter-spacing:.06em}
.xrow .xk{font-weight:800; white-space:nowrap; color:var(--gold)}
.xrow.on{background:rgba(61,220,132,.14); border-color:var(--ok)}
.xrow.epic{border-color:var(--gold)}
.xrow.big{min-height:62px; padding:10px 12px} .xrow.big b{font-size:1.15rem}
.xrow.num{cursor:default; flex-direction:column; align-items:stretch; gap:6px}
.xrow .grow{min-width:0}
.xtop{display:flex; align-items:center; gap:10px}
.hstep{display:flex; align-items:center; gap:6px}
.hstep button{min-width:40px; height:40px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--text); font-weight:800; font-size:1.2rem; cursor:pointer; font-family:inherit; touch-action:manipulation}
.hstep .hv{min-width:52px; padding:0 6px; font-size:1.05rem; background:var(--bg2)}
.xrow.on .hstep .hv{border-color:var(--ok)}
select.txt{appearance:auto; -webkit-appearance:auto; height:48px}
.hitem{padding:10px 0; border-bottom:2px solid var(--line)} .hitem:last-child{border-bottom:0} .hitem .se{font-size:34px; width:44px; text-align:center}
.hbtns{display:flex; gap:8px; margin-top:8px} .hbtns .btn{margin:0; padding:8px; font-size:.95rem; min-height:40px}
.xrow.on .xk{color:var(--ok); font-size:1.3rem}
.heat i.x1,.legend i.x1{background:rgba(255,194,61,.28)} .heat i.x2{background:rgba(255,194,61,.45)} .heat i.x3,.legend i.x3{background:rgba(255,194,61,.65)} .heat i.x4{background:rgba(255,194,61,.85)} .heat i.x5,.legend i.x5{background:var(--gold)}

/* grids */
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.kc{aspect-ratio:3/4; border-radius:16px; border:2px solid var(--line); background:var(--card2); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 6px; text-align:center; font-weight:800; font-size:.82rem; line-height:1.15; cursor:pointer; position:relative; box-shadow:0 4px 0 rgba(0,0,0,.25); font-family:inherit; color:inherit}
.kc .ke{font-size:2.2rem; margin-bottom:4px}
.kc.locked{opacity:.4; cursor:default}
.kc.r-r{border-color:var(--blue)} .kc.r-e{border-color:var(--purple); box-shadow:0 0 14px rgba(196,107,255,.45)} .kc.r-l{border-color:var(--gold); box-shadow:0 0 18px rgba(255,194,61,.55)}
.kc .new{position:absolute; top:-7px; right:-7px; background:var(--bad); color:#fff; font-size:.7rem; padding:1px 7px; border-radius:99px}
.rar{display:inline-block; font-size:.75rem; font-weight:800; letter-spacing:.08em; padding:2px 10px; border-radius:99px; text-transform:uppercase}
.rar.r-c{background:var(--card2)} .rar.r-r{background:var(--blue); color:#012} .rar.r-e{background:var(--purple); color:#fff} .rar.r-l{background:var(--gold); color:#2a1d00}
.badge{border-radius:16px; border:2px solid var(--line); background:var(--card2); padding:10px 6px; text-align:center; font-weight:800; font-size:.8rem; line-height:1.15; cursor:pointer; font-family:inherit; color:inherit}
.badge .be{font-size:2rem}
.badge.locked{opacity:.35; filter:grayscale(1)}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.stat{background:var(--bg2); border-radius:14px; padding:8px; text-align:center}
.stat b{display:block; font-size:1.6rem; line-height:1.1}
.stat span{font-size:.75rem; color:var(--dim); font-weight:800}
.heat{display:grid; grid-template-rows:repeat(7,1fr); grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; margin-top:8px}
.heat i{aspect-ratio:1; border-radius:4px; background:var(--bg2); display:block}
.heat i.done{background:var(--fire)} .heat i.epic{background:var(--gold)} .heat i.shield{background:var(--blue)} .heat i.miss,.legend i.miss{background:transparent; box-shadow:inset 0 0 0 2px var(--bad)} .heat i.today{outline:2px dashed #fff; outline-offset:-2px} .heat i.future{background:transparent}
.legend{display:flex; flex-wrap:wrap; gap:10px; font-size:.78rem; color:var(--dim); font-weight:700; margin-top:8px}
.legend i{display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:4px}
.shop-item{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:2px solid var(--line)}
.shop-item:last-child{border-bottom:0}
.shop-item .se{font-size:38px; width:50px; text-align:center}
.link.inl{display:inline; margin:0; padding:0 4px; min-height:0; font-size:inherit}
.heat i.r1,.legend i.r1{background:var(--blue)} .heat i.r2,.legend i.r2{background:var(--purple)} .heat i.r3,.legend i.r3{background:var(--gold)} .heat i.r0,.legend i.r0{background:transparent; box-shadow:inset 0 0 0 2px var(--blue)}
.wd.read b{background:var(--blue); border-color:var(--blue); color:#012} .wd.read2 b{background:var(--purple); border-color:var(--purple)} .wd.read3 b{background:var(--gold); border-color:var(--gold); color:#2a1d00}
.stag{display:inline-block; font-size:.7rem; font-weight:800; padding:1px 7px; border-radius:99px; background:var(--bg2); color:var(--muted); vertical-align:2px; margin-left:6px}
.stag.on{background:var(--ok); color:#04230f}
.shop-item .btn{width:auto; margin:0; padding:9px 14px; font-size:1rem; white-space:nowrap; min-height:44px}
.menu .btn{justify-content:flex-start}
.diary{border-bottom:2px solid var(--line); padding:8px 0}
.diary:last-child{border-bottom:0}
.stepper{display:flex; align-items:center; gap:12px; justify-content:center; margin:6px 0}
.stepper button{width:46px; height:46px; border-radius:14px; border:2px solid var(--line); background:var(--card2); font-size:1.4rem; font-weight:800; cursor:pointer}
.stepper b{font-size:2rem; min-width:64px; text-align:center}
details{margin-top:10px} summary{cursor:pointer; font-weight:800; color:var(--muted); padding:10px 0; min-height:44px}
ol{padding-left:1.3em; margin:.4em 0} ol li{margin:.25em 0; line-height:1.35}

/* tabs, modal, toast, fx */
#tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--bg2); border-top:2px solid var(--line); padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
#tabs .in{display:flex; max-width:520px; margin:0 auto; justify-content:space-around}
#tabs button{position:relative; background:none; border:0; color:var(--dim); font-weight:800; font-size:.74rem; display:flex; flex-direction:column; align-items:center; padding:4px 10px; cursor:pointer; border-radius:12px; line-height:1.1; min-width:56px}
#tabs button span{font-size:1.45rem; line-height:1.2}
#tabs button.on{color:#fff; background:var(--card)}
#tabs .dot{position:absolute; top:2px; right:8px; width:10px; height:10px; border-radius:50%; background:var(--bad)}
#modal{position:fixed; inset:0; z-index:50; background:rgba(5,3,20,.78); display:grid; place-items:center; padding:16px}
#modal[hidden]{display:none}
.mc{width:100%; max-width:430px; background:var(--card); border:2px solid var(--line); border-radius:24px; padding:22px 18px; text-align:center; max-height:86dvh; overflow:auto; animation:pop .42s cubic-bezier(.2,1.4,.4,1) both; outline:none}
.mc.left{text-align:left}
.mc h2{margin-top:.2em}
.lvup{font-size:2.4rem; font-weight:800; color:var(--gold); letter-spacing:.04em; line-height:1}
#toasts{position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:0; right:0; z-index:60; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 12px}
.toast{pointer-events:auto; background:var(--gold); color:#2a1d00; font-weight:800; padding:10px 16px; border-radius:16px; box-shadow:0 4px 0 var(--gold-d); animation:pop .4s both; max-width:480px; cursor:pointer}
.floatxp{position:fixed; z-index:65; font-weight:800; font-size:2rem; color:var(--gold); text-shadow:0 3px 0 rgba(0,0,0,.4); pointer-events:none; animation:floatup 1.1s ease-out forwards}
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:70}

@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.05)}75%{transform:rotate(12deg) scale(1.05)}}
@keyframes floatup{0%{opacity:0; transform:translate(-50%,10px) scale(.6)}20%{opacity:1; transform:translate(-50%,0) scale(1.1)}100%{opacity:0; transform:translate(-50%,-90px) scale(1)}}
.wobble{display:inline-block; animation:wobble 1.5s ease-in-out infinite}
.bob{display:inline-block; animation:bob 2.6s ease-in-out infinite}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.pulse{animation:pulse 1.5s ease-in-out infinite}
.shake{display:inline-block; animation:shake .35s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*,*::before{animation:none !important; transition:none !important}}
</style>

function now(){

}

const addD = (k,n) => { const d = pd(k); d.setDate(d.getDate()+n); return dk(d); };

const SIG_RE = /^data:image\/png;base64,[A-Za-z0-9+/=]+$/;
function validSigv(v){
  if (!v || !Number.isFinite(v.w) || !Number.isFinite(v.h) || !Array.isArray(v.s)) return false;
  let n = 0;
  for (const st of v.s) { if (!Array.isArray(st) || st.length % 2) return false; n += st.length; if (st.some(x => !Number.isFinite(x))) return false; }
  return n <= 8000;
}
function sigHTML(p){
  if (p.sigv && validSigv(p.sigv)) {
    const d = p.sigv.s.map(st => st.length === 2 ? `M${st[0]} ${st[1]}l.1 .1` : 'M' + st.map((x, i) => (i % 2 ? ' ' : (i ? 'L' : '')) + Math.round(x)).join('')).join('');
    return `<svg class="sig" viewBox="0 0 ${Math.round(p.sigv.w)} ${Math.round(p.sigv.h)}" role="img" aria-label="Firma"><path d="${d}" fill="none" stroke="#1b1640" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  if (p.sig && SIG_RE.test(p.sig)) return `<img class="sig" src="${esc(p.sig)}" alt="Firma">`;
  return '';
}

/* ---------- motore del gioco ---------- */
function calc(){
  const T = today();
  const done = new Map(), buys = new Map(), team = new Set(), moodDays = new Set(), ansDays = new Set(), owned = new Set(), awarded = new Set(), extras = new Map(), reads = new Map(), floors = new Map(), hv = new Map(), hpEv = [];
  const multi = isMulti(), H = multi ? P_().habits : [], xNday = new Map(), hstats = new Map(), pausedNow = new Set();
  let chestG = 0, bonusXP = 0, spent = 0, early = 0, gifts = 0;
  for (const e of S.ev) {
    switch (e.t) {
      case 'done': done.set(e.d, e); break;
      case 'mood': moodDays.add(e.d); break;
      case 'answer': if (!e.skip) ansDays.add(e.d); break;
      case 'chest': chestG += e.g || 0; break;
      case 'bonus': bonusXP += e.xp || 0; break;
      case 'team': team.add(e.d); break;
      case 'award': awarded.add(e.id); break;
      case 'extra': if (!extras.has(e.d)) extras.set(e.d, new Set()); extras.get(e.d).add(e.k); break;
      case 'read': { const r = reads.get(e.d) || {p:0, m:0, ok:false, mult:0}; if (e.u === 'min') r.m += e.n; else r.p += e.n; reads.set(e.d, r); break; }
      case 'readfloor': floors.set(e.d, e.lv); break;
      case 'h': if (!hv.has(e.d)) hv.set(e.d, new Map()); hv.get(e.d).set(e.id, {v:e.v, ts:e.ts}); break;
      case 'hp': hpEv.push(e); break;
      case 'buy': spent += e.cost || 0;
        if (e.item === 'shield') buys.set(e.d, (buys.get(e.d) || 0) + 1); else if (e.item === 'gift') gifts++; else owned.add(e.item); break;
    }
  }
  if (multi) {
    // più abitudini: la fiamma del giorno è «tutte le core fatte»; le extra fatte vanno nella mappa degli extra; ogni abitudine ha la sua serie
    H.forEach(h => hstats.set(h.id, {chain:0, best:0, total:0, gap:0}));
    hpEv.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
    const paused = new Set(); let pi = 0;
    const d0 = [P_().created, ...hv.keys(), ...hpEv.map(e => e.d)].sort()[0];
    for (let d = d0; d <= T; d = addD(d, 1)) {
      while (pi < hpEv.length && hpEv[pi].d <= d) { if (hpEv[pi].on) paused.add(hpEv[pi].id); else paused.delete(hpEv[pi].id); pi++; }
      const vals = hv.get(d) || new Map(), act = H.filter(h => !paused.has(h.id));
      const core = act.filter(h => h.role === 'core'), ex = act.filter(h => h.role === 'extra');
      const val = h => vals.get(h.id)?.v || 0;
      if (core.length && core.every(h => hDone(h, val(h)))) {
        const nums = core.filter(h => h.type === 'num' && h.epic > 0);
        const ts = core.reduce((a, h) => Math.max(a, vals.get(h.id)?.ts || 0), 0) || null;
        done.set(d, {t:'done', d, epic: nums.length > 0 && nums.every(h => hEpic(h, val(h))), ts});
      }
      const xs = new Set(ex.filter(h => hDone(h, val(h))).map(h => h.id));
      if (xs.size) extras.set(d, xs);
      xNday.set(d, ex.length);
      for (const h of act) {
        const s = hstats.get(h.id), ok = hDone(h, val(h));
        if (ok) { s.total++; s.chain++; s.gap = 0; if (s.chain > s.best) s.best = s.chain; }
        else if (d < T && s.chain > 0) { s.gap++; if (s.gap >= 2) { s.chain = 0; s.gap = 0; } }
      }
      if (d === T) paused.forEach(id => pausedNow.add(id));
    }
  }
  for (const e of done.values()) if (e.ts) { const hh = new Date(e.ts).getHours(); if (hh >= 5 && hh < 9) early++; }
  let xp = bonusXP + moodDays.size*5 + ansDays.size*5;
  let chain = 0, best = 0, gap = 0, earned = 0, bought = 0, shieldsUsed = 0, total = 0, epics = 0, comebacks = 0, broken = false, lastKillWs = null;
  let teamChain = 0, teamBest = 0;
  let xTotal = 0, xFull = 0, xChain = 0, xBest = 0, xGap = 0, xGems = 0;
  let rChain = 0, rBest = 0, rGap = 0, rGems = 0, rDays = 0, rDouble = 0, rTriple = 0, rLv = 1, rMaxLv = 1, rPages = 0, rMins = 0, rLvSince = null;
  const weekHits = new Map(), bossWeeks = new Set(), shielded = new Set(), missed = new Set();
  const keys = [...done.keys(), ...buys.keys(), ...extras.keys(), ...reads.keys(), ...floors.keys()].sort();
  const start = keys.length ? keys[0] : T;
  for (let d = start; d <= T; d = addD(d, 1)) {
    const b = buys.get(d); if (b) bought = Math.min(3 - earned, bought + b);
    // extra: serie a parte, stessa regola della fiamma (si azzera solo dopo due giorni saltati), senza scudi
    const xn = extras.get(d)?.size || 0, xNd = multi ? (xNday.get(d) || 0) : EXTRA.length, xNeed = multi ? Math.max(1, Math.ceil(xNd * X_RATIO)) : EXTRA_DAY;
    const xFullDay = xNd > 0 && xn >= xNd;
    if (xn) { xTotal += xn; xp += xn * EXTRA_XP; xGems += xn * EXTRA_GEM; if (xFullDay) { xFull++; xGems += EXTRA_FULL_GEM; } }
    if (xNd > 0 && xn >= xNeed) { xChain++; xGap = 0; if (xChain > xBest) xBest = xChain; if (xChain % 7 === 0) xGems += EXTRA_WEEK_GEM; }
    else if (xNd > 0 && d < T && xChain > 0) { xGap++; if (xGap >= 2) { xChain = 0; xGap = 0; } }
    // lettura: il piano in vigore quel giorno decide se la giornata conta; stessa regola «mai due di fila», senza scudi
    if (floors.has(d)) { rLv = Math.min(READ_FLOORS.length, Math.max(1, floors.get(d))); rLvSince = d; if (rLv > rMaxLv) rMaxLv = rLv; }
    const rr = reads.get(d);
    if (rr) {
      const f = READ_FLOORS[rLv - 1]; rr.mult = Math.max(rr.p / f.p, rr.m / f.m); rr.ok = rr.mult >= 1; rr.lv = rLv;
      rPages += rr.p; rMins += rr.m;
      if (rr.ok) {
        rDays++; rChain++; rGap = 0; xp += READ_XP; rGems += READ_GEM; if (rChain > rBest) rBest = rChain;
        if (rr.mult >= 2) { rDouble++; rGems += READ_X2_GEM; xp += 5; }
        if (rr.mult >= 3) { rTriple++; rGems += READ_X3_GEM; xp += 5; }
        if (rChain % 7 === 0) rGems += READ_WEEK_GEM;
        if (rChain % 30 === 0) rGems += READ_MONTH_GEM;
      }
    }
    if (!rr?.ok && d < T && rChain > 0) { rGap++; if (rGap >= 2) { rChain = 0; rGap = 0; } }
    const e = done.get(d);
    if (e) {
      if (broken) { comebacks++; broken = false; }
      gap = 0; chain++; total++; if (e.epic) epics++;
      xp += (e.epic ? 25 : 10) + Math.min(10, Math.floor(chain/7));
      if (chain % 7 === 0 && earned < 2 && earned + bought < 3) earned++;
      if (chain > best) best = chain;

let AC = null;
function tone(seq){
  if (!S.set.sound) return;
  try {
    if (AC && AC.state === 'closed') AC = null;
    AC ||= new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state !== 'running') AC.resume().catch(() => {});
    const t0 = AC.currentTime + 0.02;
    for (const [f, st, du, type='square', vol=0.05] of seq) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0+st); g.gain.exponentialRampToValueAtTime(vol, t0+st+0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0+st+du);
      o.connect(g).connect(AC.destination); o.start(t0+st); o.stop(t0+st+du+0.03);
    }
  } catch(e) {}
}

const fx = {c:$('#fx'), parts:[], on:false};
function sizeFx(){ const d = devicePixelRatio || 1; fx.c.width = innerWidth*d; fx.c.height = innerHeight*d; fx.ctx = fx.c.getContext('2d'); fx.ctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize', sizeFx); sizeFx();
function confetti(n=120, emo=null){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#ffc23d','#ff7a1a','#7c5cff','#3ddc84','#4cc3ff','#ff5a7a'];
  for (let i = 0; i < n; i++) fx.parts.push({x:innerWidth/2 + (Math.random()-.5)*80, y:innerHeight*.42, vx:(Math.random()-.5)*13, vy:-Math.random()*15-4, r:Math.random()*6, s:6+Math.random()*7, c:pick(cols), e:emo && Math.random()<.35 ? pick(emo) : null, l:0});
  if (!fx.on) { fx.on = true; requestAnimationFrame(fxStep); }
}
function fxStep(){
  const x = fx.ctx; x.clearRect(0,0,innerWidth,innerHeight);
  fx.parts = fx.parts.filter(p => p.l < 160 && p.y < innerHeight + 40);
  for (const p of fx.parts) {
    p.l++; p.vy += .38; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += .1;
    x.save(); x.translate(p.x, p.y); x.rotate(p.r);
    if (p.e) { x.font = '22px serif'; x.fillText(p.e, -11, 8); } else { x.fillStyle = p.c; x.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); }
    x.restore();
  }
  if (fx.parts.length) requestAnimationFrame(fxStep); else { fx.on = false; x.clearRect(0,0,innerWidth,innerHeight); }
}

const MQ = []; let mOpen = false, lastFocus = null;
function showModal(html, opt={}){ MQ.push({html, opt}); if (!mOpen) nextModal(); }
function setInert(v){ for (const id of ['app','tabs']) { const el = document.getElementById(id); if (el) el.inert = v; } }
function nextModal(){
  const m = $('#modal'); const it = MQ.shift();
  if (!it) {
    const was = mOpen; mOpen = false; m.hidden = true; m.innerHTML = ''; setInert(false);

function goldiReady(c){

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act] || WACT[el.dataset.act]; if (!f) return;
  if (guarded()) { e.preventDefault(); e.stopPropagation(); return; }
  if (!el.matches('a[href]')) e.preventDefault();
  f(el);
  const act = el.dataset.act;
  guard(['done','buy','team','mood','undook','unteamok'].includes(act) ? 700 : act.startsWith('wz-') ? 300 : 400);
});
document.addEventListener('input', e => {
  if (e.target.id === 'ans') { draft = {d: today(), a: e.target.value}; return; }

  const el = e.target.closest('[data-field]'); if (!el || !W) return;

  else W[f] = el.value;
  wzLive();
});

function pactHTML(p){
  const ob = (p.obstacles || []).filter(k => OBST[k]);
  return `<div class="pact"><div class="pact-title">📜 IL PATTO</div>
    <p>Io, <b>${esc(cap1(p.name))}</b>, sono uno che <b>${esc(p.identity)}</b>.</p>
    ${Array.isArray(p.habits) && p.habits.length ? `<p><b>${esc(p.cue)}</b>, ${esc(p.place)}, ogni giorno le mie quest:</p><ul>${sortH(p.habits.filter(h => h.role === 'core')).map(h => `<li>${h.e} <b>${esc(hLine(h))}</b>${h.type === 'num' && h.epic ? ` <span class="small">(epica ${esc(hUnit(h.epic, h))})</span>` : ''}</li>`).join('')}</ul><p>E quando posso, ${p.habits.filter(h => h.role === 'extra').length} extra in più.</p>`
    : `<p><b>${esc(p.cue)}</b>, farò <b>${esc(qty(p.habit.mini, p.habit))}</b> ${esc(p.place)}.</p>
    <p>Nei giorni da campione: <b>${esc(qty(p.habit.epic, p.habit))}</b>.</p>`}
    ${ob.length ? `<ul>${ob.map(k => `<li>Se <b>${OBST[k].l}</b> → ${planFor(k, p)}</li>`).join('')}</ul>` : ''}
    ${p.bundle ? '<p>🎮 Prima la quest, poi console o telefono.</p>' : ''}
    <p><b>Mai due giorni di fila.</b></p>
    ${sigHTML(p)}
    <div class="pact-foot">Firmato il ${fmtDate(p.signed || p.created)}</div></div>`;
}

function sigPad(cv){

  const k = 300 / r0.width, H = Math.round(r0.height * k);

  const strokes = [];

    const tot = () => s.reduce((a, st) => a + st.length, 0);

}

      : `<p class="center"><b>+60 XP</b> per il patto firmato → <b>Livello 2</b>!</p>
         <div class="say">Ultima cosa, la più importante: la prima quest si fa <b>adesso</b>, finché sei carico. <b>${esc(questLine())}</b>. ${W.multi ? 'Poi segnala nella Home.' : 'Poi premi FATTO.'}</div>
         <p class="small dim center">⏰ Il promemoria lo attivi dalla home, in 30 secondi.</p>`;
    tone(SND.level); confetti(220, ['⭐','🔥','✨']);
    nb.style.visibility = 'visible';
  }, 1600);
}
const gotoStep = i => { const dir = i >= WI ? 1 : -1; WI = i; while (STEPS[WI]?.skip?.()) WI += dir; if (STEPS[WI].id === 'pact') W.sigv = null; renderWizard(); scrollTo(0,0); };
const WACT = {
  'wz-next': () => {
    const st = STEPS[WI]; if (!st.ok()) return;
    tone(SND.tap);
    if (st.id === 'pact') {
      S.profile = draftProfile(); S.ui.awardInit = 1;
      if (!S.ev.some(e => e.t === 'bonus' && e.why === 'patto')) S.ev.push({t:'bonus', d:today(), xp:60, why:'patto'});
      if (W.multi && +W.readLv > 1 && !S.ev.some(e => e.t === 'readfloor')) S.ev.push({t:'readfloor', d:today(), lv:+W.readLv});
      save(); keepData();
    }
    if (st.id === 'hatch') { W = null; S.ui.tab = 'home'; save(); render(); scrollTo(0,0); return; }
    gotoStep(WI + 1);
  },
  'wz-back': () => { if (WI > 0) gotoStep(WI - 1); },
  'wz-cancel': () => { W = null; render(); },
  'wz-chip': el => {
    const f = el.dataset.f, max = +el.dataset.multi || 0;
    let v = el.dataset.v; if (v === 'true') v = true; else if (v === 'false') v = false; else if (['mini','epic'].includes(f)) v = +v;
    if (max) {
      const a = W[f]; const i = a.indexOf(v);
      if (i >= 0) a.splice(i, 1); else { if (a.length >= max) { toast(`Massimo ${max}`); return; } a.push(v); }
      if (f === 'hsel') W.hcore = W.hcore.filter(id => W.hsel.includes(id));
    } else {
      W[f] = v;
      if (f === 'habitKey') { const h = HABITS[v]; W.mini = h ? h.minis[0] : 0; W.epic = h ? h.epics[1] : 0; }
      if (f === 'age' && v === 'Adulto') { W.goals = W.goals.filter(g => g !== 'papa'); if (!W.hsel.length) { W.multi = true; W.hsel = CATALOG.map(h => h.id); W.hcore = CATALOG.filter(h => h.role === 'core').map(h => h.id); } }
      if (f === 'age' && v !== 'Adulto') W.multi = false;
    }
    tone(SND.tap); renderWizard();
  },
  'wz-l1': el => {
    const up = el.dataset.v === 'up';
    W[up ? '_l1up' : '_l1down'] = true; renderWizard();
    const n = $(up ? '#l1u' : '#l1d'), dd = $(up ? '#l1ud' : '#l1dd'), t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0)/1700), day = Math.round(365*k), v = Math.pow(up ? 1.01 : 0.99, day);
      n.textContent = v.toLocaleString('it-IT', {minimumFractionDigits: v < 1 ? 2 : 1, maximumFractionDigits: v < 1 ? 2 : 1}); dd.textContent = 'giorno ' + day;
      if (k < 1) requestAnimationFrame(step); else tone(up ? SND.done : [[220,0,.25,'sawtooth',.04]]); };
    requestAnimationFrame(step);
  },
  'wz-sigclear': () => { W.sigv = null; renderWizard(); },
};

/* ---------- nuova versione ---------- */
let newVer = null;   // {v, nota} letto da version.json quando è diverso da VERSION
async function checkVersion(){
  if (!location.protocol.startsWith('http')) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'}); if (!r.ok) return;
    const j = await r.json();
    if (!j || typeof j.v !== 'string' || j.v === VERSION || j.v === newVer?.v) return;
    newVer = {v:j.v.slice(0, 12), nota:String(j.nota || '').slice(0, 120)};
    if (S.profile && !W && !mOpen) render();
    toast(`🆕 È uscita la versione ${newVer.v}: tocca per aggiornare`, () => ACT.reload());
  } catch(e) {}
}

/* ---------- avvio ---------- */
function checkDay(){
  // a modale aperto o mentre scrive aspetta: chiudere il modale ridisegna comunque sul giorno giusto
  if (W || !S.profile || !shownDay || today() === shownDay || mOpen || document.activeElement?.matches('textarea, input')) return;
  S.ui.tab = 'home'; render();
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 30 * 60e3 && !W && !mOpen && !document.activeElement?.matches('textarea, input')) { location.reload(); return; }
  checkDay(); checkVersion();
  navigator.serviceWorker?.getRegistration?.().then(g => g && g.update()).catch(() => {});
  if (AC) AC.suspend().then(() => AC.resume()).catch(() => { try { AC.close(); } catch(e) {} AC = null; });
});
addEventListener('focus', checkDay);
addEventListener('pageshow', checkDay);
setInterval(checkDay, 30000);

S.ui.tab = 'home';
try { render(); }
catch (err) {
  app.innerHTML = `<div class="card"><h2>⚠️ Qualcosa non va con i dati salvati</h2><p class="small">Il gioco non riesce a leggere la partita. Copia i dati (senza il diario) e mandali a chi ti ha dato l'app, poi puoi ricominciare.</p><button class="btn" id="rawcopy">📋 Copia i dati (senza diario)</button><button class="btn ghost" data-act="reset">Ricomincia da zero</button></div>`;
  $('#rawcopy').onclick = () => {
    let t = localStorage.getItem(KEY) || '';
    try { const o = JSON.parse(t); if (Array.isArray(o?.ev)) o.ev = o.ev.map(e => e?.t === 'answer' ? {t:'answer', d:e.d, skip:e.skip} : e?.t === 'mood' ? {t:'mood', d:e.d} : e); t = JSON.stringify(o); } catch(e) {}
    copyText(t, 'Dati copiati ✓');
  };
}
keepData(); checkVersion(); setInterval(checkVersion, 60 * 60e3);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
